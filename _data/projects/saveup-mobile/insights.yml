- problem: '"All goals" and "single goal" spaces are too similar.'
  description: 'Users need clear visual distinctions between "all goals" and "single goal" spaces.'
  image:
    src: https://cdn.jsdelivr.net/gh/nszczerba99/ux-portfolio-images@main/projects/saveup-mobile-app/insight1.webp
    alt: Insight illustration

- problem: The plus button being the same in both <em>Transactions</em> and <em>Goals</em> tabs confuses users.
  description: 'Users need a clear visual distinction between plus buttons in <em>Transactions</em> and <em>Goals</em>.'
  image:
    src: https://cdn.jsdelivr.net/gh/nszczerba99/ux-portfolio-images@main/projects/saveup-mobile-app/insight2.webp
    alt: Insight illustration

- problem: The <em>Goal Visibility Mode</em> is often misunderstood.
  description: Users need the <em>Goal Visibility Mode</em> to be phrased and described differently, clearly stating it applies to goal savings.
  image:
    src: https://cdn.jsdelivr.net/gh/nszczerba99/ux-portfolio-images@main/projects/saveup-mobile-app/insight3.webp
    alt: Insight illustration

- problem: 'The "Goal Prioritization" button is not intuitive at all.'
  description: 'Users need a different design of the "Goal Prioritization" button that clearly conveys its purpose, possibly using text.'
  image:
    src: https://cdn.jsdelivr.net/gh/nszczerba99/ux-portfolio-images@main/projects/saveup-mobile-app/insight4.webp
    alt: Insight illustration

- problem: The placement of the <em>Balances</em> section within the <em>Overview</em> tab is not intuitive.
  description: Users need the <em>Balances</em> section to be in the <em>Transactions</em> tab instead of <em>Overview</em>.
  image:
    src: https://cdn.jsdelivr.net/gh/nszczerba99/ux-portfolio-images@main/projects/saveup-mobile-app/insight5.webp
    alt: Insight illustration

- problem: Permission settings are too lenient.
  description: Users need more cautious permission management inside a goal.
  image:
    src: https://cdn.jsdelivr.net/gh/nszczerba99/ux-portfolio-images@main/projects/saveup-mobile-app/insight6.webp
    alt: Insight illustration